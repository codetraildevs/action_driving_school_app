org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# Disable the incubating Gradle problems report (build/reports/problems/problems-report.html)
# — it is regenerated on every build and adds no value for this project.
org.gradle.problems.report=false
# NOTE: machine-specific settings (e.g. org.gradle.java.home pointing at a local JDK)
# must NOT be committed — they break CI. Set JAVA_HOME locally instead.
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=true
# AGP 9.x: Use legacy DSL + explicit Kotlin (not built-in)
android.newDsl=false
android.builtInKotlin=false
