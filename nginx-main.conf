# /etc/nginx/nginx.conf
#
# Main nginx configuration for DatabaseMart Shared IP setup.
# SSL is handled by the DatabaseMart load balancer.
# This file contains all http-context directives.
# Site-specific configs are in /etc/nginx/sites-available/

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    # ── Basic Settings ─────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'cache=$upstream_cache_status rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ── Gzip ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        application/wasm;

    # ── Rate Limiting Zones ────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;

    # ── Proxy Cache ────────────────────────────────────────
    proxy_cache_path /var/cache/nginx/driving_school
        levels=1:2
        keys_zone=driving_school_cache:10m
        max_size=256m
        inactive=60m
        use_temp_path=off;

    # ── Upstream ───────────────────────────────────────────
    upstream driving_school {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # ── HSTS Map ───────────────────────────────────────────
    map $http_x_forwarded_proto $hsts_header {
        https "max-age=31536000; includeSubDomains";
        default "";
    }

    # ── Virtual Host Configs ───────────────────────────────
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
