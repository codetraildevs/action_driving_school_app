[versions]
# ─── Kotlin & Build ───
kotlin = "2.4.10"
agp = "9.3.1"
hilt = "2.60.1"
hilt-work = "1.4.0"
firebase-bom = "34.17.0"
firebase-crashlytics = "3.0.7"
firebase-gms = "4.5.0"
play-integrity = "1.6.0"
play-services-ads = "24.0.0"

# ─── AndroidX Core ───
appcompat = "1.7.1"
core-ktx = "1.19.0"
material = "1.14.0"
constraintlayout = "2.2.2"
swiperefreshlayout = "1.2.0"
activity = "1.13.0"

# ─── Lifecycle ───
lifecycle = "2.11.0"

# ─── Navigation ───
navigation = "2.9.8"

# ─── Room ───
room = "2.8.4"

# ─── Networking ───
retrofit = "2.12.0"
okhttp = "5.4.0"
gson = "2.14.0"

# ─── Image Loading ───
glide = "5.0.9"

# ─── DI / Compilers ───
mapstruct = "1.6.3"

# ─── Background Work ───
work = "2.11.2"

# ─── Secure Storage ───
security-crypto = "1.1.0"

# ─── In-App Updates ───
app-update = "2.1.0"

# ─── Photo Viewer ───
photoview = "2.3.0"

# ─── Shimmer ───
shimmer = "0.5.0"

# ─── SVG ───
androidsvg = "1.4"

# ─── Baseline Profile ───
profileinstaller = "1.4.1"
benchmark-macro = "1.4.1"
uiautomator = "2.4.0"
baselineprofile-plugin = "1.4.1"

# ─── Phone Number Handling ───
libphonenumber = "9.0.35"

# ─── Testing ───
junit = "4.13.2"
junit-androidx = "1.3.0"
test-runner = "1.7.0"
mockito = "5.23.0"
espresso = "3.7.0"
core-testing = "2.2.0"


[libraries]
# ── AndroidX Core ──
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
com-google-android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# ── Lifecycle ──
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
androidx-lifecycle-compiler = { group = "androidx.lifecycle", name = "lifecycle-compiler", version.ref = "lifecycle" }

# ── Navigation ──
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# ── Room ──
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ── WorkManager ──
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }

# ── Security ──
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }

# ── Networking ──
squareup-retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
squareup-retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
squareup-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
squareup-okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# ── Image Loading ──
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-okhttp = { group = "com.github.bumptech.glide", name = "okhttp3-integration", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

# ── DI / Hilt ──
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }
hilt-work-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-work" }

# ── MapStruct ──
mapstruct = { group = "org.mapstruct", name = "mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { group = "org.mapstruct", name = "mapstruct-processor", version.ref = "mapstruct" }

# ── PhotoView ──
photoview = { group = "com.github.chrisbanes", name = "PhotoView", version.ref = "photoview" }

# ── Shimmer ──
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }

# ── In-App Updates ──
app-update = { group = "com.google.android.play", name = "app-update", version.ref = "app-update" }
app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "app-update" }

# ── SVG ──
androidsvg = { group = "com.caverock", name = "androidsvg-aar", version.ref = "androidsvg" }

# ── Baseline Profile ──
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark-macro" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

# ── Firebase ──
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# ── Play (AdMob-prep: Integrity API) ──
play-integrity = { group = "com.google.android.play", name = "integrity", version.ref = "play-integrity" }

# ── AdMob ──
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "play-services-ads" }

# ── Phone Number Handling ──
libphonenumber = { group = "com.googlecode.libphonenumber", name = "libphonenumber", version.ref = "libphonenumber" }

# ── Testing ──
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-androidx = { group = "androidx.test.ext", name = "junit", version.ref = "junit-androidx" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "test-runner" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "core-testing" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }

hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "firebase-gms" }
firebase-crashlytics-plugin = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile-plugin" }
