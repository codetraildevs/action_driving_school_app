# /etc/nginx/sites-available/driving-school
#
# DatabaseMart Shared IP Setup:
#   - SSL is managed by the DatabaseMart load balancer (Let's Encrypt)
#   - VPS receives HTTP traffic on port 80 internally
#   - Load balancer terminates SSL and forwards to VPS:80
#
# Install:
#   sudo cp nginx-databasemart.conf /etc/nginx/sites-available/driving-school
#   sudo nginx -t && sudo systemctl reload nginx

# ── Custom Log Format ─────────────────────────────────────
log_format main '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'cache=$upstream_cache_status rt=$request_time proto=$http_x_forwarded_proto';

# ── Rate Limiting Zones ───────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;

# ── Proxy Cache Zone ──────────────────────────────────────
proxy_cache_path /var/cache/nginx/driving_school
    levels=1:2
    keys_zone=driving_school_cache:10m
    max_size=256m
    inactive=60m
    use_temp_path=off;

upstream driving_school {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ── HTTP server (receives traffic from load balancer) ─────
server {
    listen 80 default_server;
    server_name console.amategekoyumuhanda.rw _;

    # Trust the load balancer's forwarded headers
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── HSTS (based on forwarded protocol from load balancer) ──
    # Only add HSTS when request came via HTTPS from load balancer
    map $http_x_forwarded_proto $hsts_header {
        https "max-age=31536000; includeSubDomains";
        default "";
    }

    # ── Next.js Static Assets (served directly, no proxy) ──
    location /_next/static/ {
        alias /home/project3/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Uploads (served directly, no proxy) ──
    location /uploads/ {
        alias /home/project3/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Access Log ──
    access_log /var/log/nginx/driving-school_access.log main;
    error_log /var/log/nginx/driving-school_error.log warn;

    # ── API Proxy (rate-limited + cached) ──
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50M;

        # Proxy buffers
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        proxy_cache driving_school_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Login endpoint (stricter rate limit) ──
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache off;
    }

    # ── Health Check (no logging, no caching) ──
    location = /api/health {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        proxy_cache off;
    }

    # ── SSE (Server-Sent Events) ──
    location /api/sse {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # ── Everything Else (pages + Server Actions) ──
    location / {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $hsts_header always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        application/wasm;

    # ── Client Body ──
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
}
