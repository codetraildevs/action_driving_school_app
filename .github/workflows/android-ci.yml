name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fallback env vars for the signingConfig in app/build.gradle.kts
  # These are overridden by keystore.properties when present locally.
  # In CI, set these as repository secrets.
  KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
  KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
  KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json created successfully"
          else
            echo "WARNING: GOOGLE_SERVICES_JSON secret not set. Creating a placeholder..."
            echo '{
              "project_info": {
                "project_number": "000000000000",
                "project_id": "placeholder-project",
                "storage_bucket": "placeholder-project.appspot.com"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:placeholder",
                    "android_client_info": {
                      "package_name": "com.drivingschoolrwandaapp"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [
                    {
                      "current_key": "PLACEHOLDER_API_KEY"
                    }
                  ],
                  "services": {
                    "appinvite_service": {
                      "other_platform_oauth_client": []
                    }
                  }
                }
              ],
              "configuration_version": "1"
            }' > app/google-services.json
          fi

      # ── Keystore for release builds ──
      # The app/build.gradle.kts signingConfig fallback uses these env vars:
      #   KEYSTORE_FILE         → keystore path (default: upload-keystore.jks)
      #   KEYSTORE_STORE_PASSWORD → store password
      #   KEYSTORE_KEY_ALIAS    → key alias (default: upload)
      #   KEYSTORE_KEY_PASSWORD → key password
      #
      # To build release artifacts in CI, set these GitHub secrets:
      #   KEYSTORE_FILE_BASE64  → base64-encoded keystore file
      #   KEYSTORE_STORE_PASSWORD
      #   KEYSTORE_KEY_ALIAS
      #   KEYSTORE_KEY_PASSWORD
      #
      # If any secret is missing, the release build step is skipped.
      - name: Decode keystore for release builds
        id: keystore
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_FILE_BASE64" ]; then
            echo "$KEYSTORE_FILE_BASE64" | base64 -d > app/upload-keystore.jks
            echo "KEYSTORE_FILE=upload-keystore.jks" >> $GITHUB_ENV
            echo "keystore_ready=true" >> $GITHUB_OUTPUT
            echo "Keystore decoded successfully"
          else
            echo "KEYSTORE_FILE_BASE64 secret not set — skipping release build"
            echo "keystore_ready=false" >> $GITHUB_OUTPUT
          fi

      # ── Debug builds (no signing required) ──
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # ── Release builds (requires keystore secrets) ──
      - name: Build release AAB
        if: steps.keystore.outputs.keystore_ready == 'true'
        run: ./gradlew bundleRelease

      - name: Build release APK
        if: steps.keystore.outputs.keystore_ready == 'true'
        run: ./gradlew assembleRelease

      # ── Quality checks ──
      - name: Run lint checks
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # ── Espresso (instrumented) tests ──
      # Requires an Android emulator. The avd-target is set to a common API level
      # that works with the project's minSdk (27) and compileSdk (36).
      - name: Run Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          avd-name: ci-test-device
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          kvm: true
          script: ./gradlew connectedDebugAndroidTest

      # ── Upload artifacts ──
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/

      - name: Upload release AAB
        if: steps.keystore.outputs.keystore_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        if: steps.keystore.outputs.keystore_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
