name: Build .next for production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/role-based-app

      - name: List files
        run: ls -la && ls -la DRIVING_SHOOL_COMPANY_LEGACY/ 2>&1 || echo "Directory not found"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd DRIVING_SHOOL_COMPANY_LEGACY && npm install --legacy-peer-deps

      - name: Generate Prisma
        run: cd DRIVING_SHOOL_COMPANY_LEGACY && npx prisma generate

      - name: Build Next.js
        run: cd DRIVING_SHOOL_COMPANY_LEGACY && npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify .next exists
        run: ls -la DRIVING_SHOOL_COMPANY_LEGACY/.next/ | head -5

      - name: Zip .next
        run: cd DRIVING_SHOOL_COMPANY_LEGACY && tar czf /tmp/next-build.tar.gz --exclude='.next/cache' .next

      - name: Upload .next artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: /tmp/next-build.tar.gz
          retention-days: 3
