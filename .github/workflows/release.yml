name: Android Release Build

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.2, v1.1.0
  workflow_dispatch:   # Allow manual trigger from GitHub UI
    inputs:
      version_name:
        description: 'Version name override (e.g., 1.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---- Required GitHub Secrets ----
      # UPLOAD_KEYSTORE_B64      — Base64-encoded upload keystore (app/upload-keystore.jks)
      # KEYSTORE_STORE_PASSWORD  — Keystore store password
      # KEYSTORE_KEY_PASSWORD    — Keystore key password
      # KEYSTORE_KEY_ALIAS       — Keystore key alias (default: "upload")
      # GOOGLE_SERVICES_JSON     — Firebase google-services.json content
      # ---- Secrets & Credentials ----

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json created successfully"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — using placeholder"
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:placeholder",
                "android_client_info": {
                  "package_name": "com.drivingschoolrwandaapp"
                }
              },
              "oauth_client": [],
              "api_key": [{
                "current_key": "PLACEHOLDER_API_KEY"
              }],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Decode upload keystore
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > app/upload-keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "::error::UPLOAD_KEYSTORE_B64 secret is not set — release build cannot sign"
            exit 1
          fi

      - name: Create keystore.properties
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          cat > keystore.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=${KEYSTORE_STORE_PASSWORD}
          keyAlias=${KEYSTORE_KEY_ALIAS:-upload}
          keyPassword=${KEYSTORE_KEY_PASSWORD}
          EOF
          echo "keystore.properties created"

      # ---- Validate ----

      - name: Validate tag matches versionName
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            # Allow optional -buildN suffix (e.g. v1.3.0-build86) for per-build tags
            TAG_VERSION="${TAG_VERSION%-build*}"
            BUILD_VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
              echo "::error::Tag v$TAG_VERSION doesn't match build.gradle.kts version \"$BUILD_VERSION\""
              exit 1
            fi
            echo "✅ Tag v$TAG_VERSION matches build.gradle.kts version \"$BUILD_VERSION\""
          else
            echo "Skipping tag validation (manual workflow_dispatch)"
          fi

      # ---- Build & Verify ----

      - name: Run lint checks
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify AAB signing
        run: |
          echo "=== AAB Signature Verification ==="
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab 2>&1 || true
          echo ""
          if jarsigner -verify app/build/outputs/bundle/release/app-release.aab 2>&1 | grep -q "jar verified"; then
            echo "✅ AAB signature verified"
          else
            echo "::warning::AAB signature verification may have warnings (expected for self-signed keys)"
          fi

      - name: Verify APK signing
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            echo "=== APK Signature Verification ==="
            jarsigner -verify -verbose -certs "$APK" 2>&1 || true
            echo ""
            if              jarsigner -verify "$APK" 2>&1 | grep -q "jar verified"; then
              echo "✅ APK signature verified"
            else
              echo "::warning::APK signature verification may have warnings (expected for self-signed keys)"
            fi
          fi

      # ---- Upload Artifacts ----

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

      # ---- Summary ----

      - name: Build summary
        run: |
          VERSION=$(cat app/build.gradle.kts | grep "versionName" | grep -oP '"\K[^"]+')
          BUILD=$(cat app/build.gradle.kts | grep "versionCode" | grep -oP '\d+')
          echo "## ✅ Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Path |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **AAB** | \`app/build/outputs/bundle/release/app-release.aab\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | \`app/build/outputs/apk/release/app-release.apk\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION (build $BUILD)" >> $GITHUB_STEP_SUMMARY
