# /etc/nginx/sites-available/driving-school
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/driving-school
#   sudo ln -sf /etc/nginx/sites-available/driving-school /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ── Proxy Cache Zone ──────────────────────────────────────
# 10MB key zone, 256MB max disk, auto-purge after 60min idle
proxy_cache_path /var/cache/nginx/driving_school
    levels=1:2
    keys_zone=driving_school_cache:10m
    max_size=256m
    inactive=60m
    use_temp_path=off;

upstream driving_school {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name console.amategekoyumuhanda.rw 108.181.215.244 _;

    # ── SSL Challenge (Certbot) ──
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Certbot will add the HTTPS server block after running:
    #   certbot --nginx -d console.amategekoyumuhanda.rw

    # ── Next.js Static Assets (served directly, no proxy) ──
    # These files have content-hashed filenames, so we can cache aggressively.
    location /_next/static/ {
        alias /home/project3/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Uploads (served directly, no proxy) ──
    location /uploads/ {
        alias /home/project3/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── API Proxy (with caching for read-heavy endpoints) ──
    location /api/ {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Max upload size
        client_max_body_size 50M;

        # Cache GET requests for 5 minutes (stale-while-revalidate for 10min)
        proxy_cache driving_school_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── Health Check (no logging, no caching) ──
    location = /api/health {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
        proxy_cache off;
    }

    # ── SSE (Server-Sent Events) ──
    location /api/sse {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # ── Everything Else (pages + Server Actions) ──
    location / {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/html
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml;
}
