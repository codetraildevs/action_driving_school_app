# /etc/nginx/sites-available/driving-school
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/driving-school
#   sudo ln -sf /etc/nginx/sites-available/driving-school /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream driving_school {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80 default_server;
    server_name console.amategekoyumuhanda.rw 108.181.215.244 _;

    # ── SSL Challenge (Certbot) ──
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Certbot will add the HTTPS server block after running:
    #   certbot --nginx -d console.amategekoyumuhanda.rw

    # ── API Proxy ──
    location /api/ {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Max upload size
        client_max_body_size 50M;
    }

    # ── Health Check (no logging) ──
    location = /api/health {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── SSE (Server-Sent Events) ──
    location /api/sse {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # ── Static Files (Next.js) ──
    location /_next/static/ {
        proxy_pass http://driving_school;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Uploads ──
    location /uploads/ {
        proxy_pass http://driving_school;
        proxy_cache_valid 200 7d;
    }

    # ── Everything Else ──
    location / {
        proxy_pass http://driving_school;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
}
